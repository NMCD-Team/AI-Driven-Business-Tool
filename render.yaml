
services:
  # Django Backend
  - type: web
    name: ai-business-tool-backend
    env: python
    plan: starter 
    region: ohio
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py migrate
      gunicorn backend.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0 
      - key: DATABASE_URL
        fromDatabase:
          name: ai-business-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ai-business-tool.onrender.com"
      - key: FRONTEND_URL
        value: "https://ai-business-tool.onrender.com"
      - key: OPENAI_API_KEY
        sync: false  
      - key: DEFAULT_FROM_EMAIL
        value: "contact@nikkeishamoodie.ca"  
    healthCheckPath: /api/health/  
    autoDeploy: true

  # React Frontend
  - type: web
    name: ai-business-tool
    env: static
    plan: free  
    buildCommand: |
      cd frontend && npm install && npm run build
    staticPublishPath: ./front_end/build  # Adjust if your build path is different
    envVars:
      - key: REACT_APP_API_URL
        value: "https://ai-business-tool-backend.onrender.com"
      - key: REACT_APP_ENV
        value: "production"
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# PostgreSQL Database
databases:
  - name: ai-business-db
    plan: starter
    databaseName: ai_business_db
    user: ai_business_user